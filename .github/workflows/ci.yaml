name: ci
on:
  push:
  pull_request:
env:
  MXL_REF: 218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7
  NMOS_CPP_REF: fe303849527394b03bdedc8f161f377fe458bb62
  NMOS_TESTING_REF: 90018513758e6fbc096c26d7ef001f700b28b510
jobs:
  dockerfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check the Dockerfile
        run: |
          grep -q '^HEALTHCHECK' docker/Dockerfile
          grep -q '/livez' docker/Dockerfile
          docker buildx build --check --file docker/Dockerfile .

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    # Core, picture, file and API tests. No libmxl and no nmos-cpp.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build pkg-config g++ ffmpeg \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev
      - name: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: unit
        run: ctest --test-dir build --output-on-failure
      - name: api
        run: ./tests/integration/api.sh
      - name: metrics
        run: ./tests/integration/metrics.sh
      - name: alert rules (promtool)
        run: docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" --entrypoint sh prom/prometheus:v3.5.0 -c 'cd /rules && promtool check rules avsync-rules.yaml && promtool test rules avsync-rules.test.yaml'
      - name: bench script
        run: python3 tools/bench_paths.py --help >/dev/null
      - name: clock source API
        run: ./tests/integration/clock.sh
      - name: file
        run: ./tests/integration/file.sh
      - name: audio timecode files
        run: python3 tests/integration/timecode.py build/mxl-avsync
      - name: QR flash crop and codec paths
        run: python3 tests/integration/qr_flash.py --binary build/mxl-avsync --out "$RUNNER_TEMP/qr-flash"
      - name: stage 2 file paths
        run: ./tests/integration/stage2.sh
      - name: web form draft rules
        run: node --test tests/web/*.test.cjs
      - name: phone display rules
        run: node --test mobile-app/src/*.test.mjs

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build pkg-config g++ \
            curl zip unzip tar git ca-certificates python3 \
            bison flex autoconf automake libtool \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libjpeg-dev \
            libboost-system-dev libboost-thread-dev libboost-chrono-dev \
            libboost-date-time-dev libboost-regex-dev libboost-random-dev \
            libboost-filesystem-dev libcpprest-dev nlohmann-json3-dev \
            libssl-dev uuid-dev libavahi-compat-libdnssd-dev
      - name: Build MXL
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          git init /tmp/mxl
          git -C /tmp/mxl remote add origin https://github.com/dmf-mxl/mxl.git
          git -C /tmp/mxl fetch --depth 1 origin "$MXL_REF"
          git -C /tmp/mxl checkout FETCH_HEAD
          python3 - <<'PY'
          import json, pathlib, subprocess
          baseline = subprocess.check_output(["git", "-C", "/opt/vcpkg", "rev-parse", "HEAD"], text=True).strip()
          doc = json.loads(pathlib.Path("docker/mxl-vcpkg.json").read_text())
          doc["builtin-baseline"] = baseline
          pathlib.Path("/tmp/mxl-manifest").mkdir(parents=True, exist_ok=True)
          pathlib.Path("/tmp/mxl-manifest/vcpkg.json").write_text(json.dumps(doc))
          PY
          cmake -S /tmp/mxl -B /tmp/mxl/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_MANIFEST_DIR=/tmp/mxl-manifest \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DBUILD_UTILS=OFF -DBUILD_DOCS=OFF \
            -DMXL_ENABLE_FABRICS_OFI=OFF \
            -DCMAKE_INSTALL_PREFIX=/opt/mxl
          cmake --build /tmp/mxl/build -j"$(nproc)"
          sudo cmake --install /tmp/mxl/build
      - name: Fetch nmos-cpp
        run: |
          git init /tmp/nmos-cpp
          git -C /tmp/nmos-cpp remote add origin https://github.com/sony/nmos-cpp.git
          git -C /tmp/nmos-cpp fetch --depth 1 origin "$NMOS_CPP_REF"
          git -C /tmp/nmos-cpp checkout FETCH_HEAD
      - name: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/opt/mxl;/tmp/mxl/build/vcpkg_installed/x64-linux" \
            -DMXL_RUNTIME_LIB_DIRS="/opt/mxl/lib;/tmp/mxl/build/vcpkg_installed/x64-linux/lib" \
            -DAVSYNC_WITH_NMOS=ON -DNMOS_CPP_DIR=/tmp/nmos-cpp/Development
          cmake --build build -j"$(nproc)"
      - name: unit
        run: ctest --test-dir build --output-on-failure
      - name: live
        run: |
          export LD_LIBRARY_PATH="/opt/mxl/lib:/tmp/mxl/build/vcpkg_installed/x64-linux/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./tests/integration/live.sh
          python3 tests/integration/phone_generator.py
          ./tests/integration/no-signal.sh
          ./tests/integration/settings.sh
          ./tests/integration/source-image.sh
          ./tests/integration/ptp.sh
          ./tests/integration/clock.sh
          ./tests/integration/chain-latency.sh
          ./tests/integration/nmos.sh
          ./tests/integration/nmos-registry.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: nmos-testing ${{ env.NMOS_TESTING_REF }}
        run: |
          mkdir -p "$RUNNER_TEMP/nmos-testing"
          curl -fsSL "https://codeload.github.com/AMWA-TV/nmos-testing/tar.gz/$NMOS_TESTING_REF" |
            tar xz -C "$RUNNER_TEMP/nmos-testing" --strip-components=1
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check -r "$RUNNER_TEMP/nmos-testing/requirements.txt"
      - name: Kernel TAI offset
        run: sudo tests/nmos/set-tai-offset.py 37
      - name: AMWA IS-04-01 IS-04-02 IS-05-01 IS-05-02
        run: tests/nmos/amwa.sh off build/mxl-avsync
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib:/tmp/mxl/build/vcpkg_installed/x64-linux/lib
          NMOS_TESTING_DIR: ${{ runner.temp }}/nmos-testing
          NMOS_TESTING_PYTHON: ${{ runner.temp }}/venv/bin/python
          AMWA_OUT: ${{ runner.temp }}/amwa
      - name: AMWA summary
        if: always()
        run: cat "$RUNNER_TEMP/amwa/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amwa
          path: ${{ runner.temp }}/amwa
          if-no-files-found: ignore

  phone-clock:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Foreground screen wake lifecycle
        run: |
          swiftc mobile-app/modules/avsync/ios/ScreenAwakeState.swift mobile-app/tests/native/screen-awake.swift -o /tmp/avsync-screen-awake
          /tmp/avsync-screen-awake
      - name: Deferred audio decode and immutable snapshots
        run: |
          clang++ -std=c++20 -O2 -I core/include -I third_party/pocketfft mobile-app/tests/native/deferred-audio.cpp mobile-app/modules/avsync/ios/Core_*.cpp -o /tmp/avsync-deferred-audio
          /tmp/avsync-deferred-audio
      - name: Camera rate and capture telemetry
        run: |
          swiftc mobile-app/modules/avsync/ios/CaptureProfile.swift mobile-app/tests/native/capture-profile.swift -o /tmp/avsync-capture-profile
          /tmp/avsync-capture-profile
          clang++ -std=c++20 -O2 -I . -I core/include -I third_party/pocketfft mobile-app/tests/native/capture-cadence.cpp mobile-app/modules/avsync/ios/Core_*.cpp -o /tmp/avsync-capture-cadence
          /tmp/avsync-capture-cadence
      - name: Swift SNTP protocol and real local UDP exchange
        run: python3 mobile-app/tests/native/clock.py
      - name: Direct sender clock packet and real UDP exchange
        run: |
          swiftc mobile-app/modules/avsync/ios/SntpPacket.swift mobile-app/modules/avsync/ios/PhoneClock.swift mobile-app/modules/avsync/ios/PeerClockPacket.swift mobile-app/modules/avsync/ios/PeerClock.swift mobile-app/tests/native/peer-clock.swift -o /tmp/avsync-peer-clock
          /tmp/avsync-peer-clock
      - name: Native Mac direct source
        run: python3 tools/direct-device/build.py
      - name: Experimental device-calibration maths bridge
        run: |
          clang++ -std=c++20 -O2 -fobjc-arc -I mobile-app/modules/avsync/ios -I core/include -I third_party/pocketfft \
            mobile-app/tests/native/calibration-math.mm mobile-app/modules/avsync/ios/AVSyncDeviceCalibration.mm \
            core/src/two_way.cpp core/src/timecode.cpp core/src/chirp.cpp core/src/detect.cpp core/src/g711.cpp \
            -framework Foundation -o /tmp/avsync-calibration-math
          /tmp/avsync-calibration-math
