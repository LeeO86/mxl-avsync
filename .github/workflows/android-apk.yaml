name: Android APK

# A release APK of the phone app for testing (side-loading), as a workflow artifact.
# It is signed with the Expo template's debug key, so every build installs over the
# last one; it is not for a store. Runs on demand and on pull requests that touch
# the app or the shared core.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile-app/**"
      - "core/**"
      - ".github/workflows/android-apk.yaml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK and CMake (the module's native build)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - run: npm ci

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Release APK (arm64-v8a)
        working-directory: mobile-app/android
        run: ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Name the APK
        run: |
          version="$(node -p "require('./app.json').expo.version")"
          cp android/app/build/outputs/apk/release/app-release.apk "avsync-${version}-${GITHUB_SHA::7}.apk"
          echo "APK_NAME=avsync-${version}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: mobile-app/${{ env.APK_NAME }}.apk
          retention-days: 30
