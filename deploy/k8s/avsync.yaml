# Both roles in one pod so they share a memory volume. No registry and no DNS-SD.
# The platform chart owns a production install. This pod is the demo shape.
# It was not applied here: this machine has no cluster and no Docker.
apiVersion: v1
kind: Pod
metadata:
  name: mxl-avsync-demo
  labels:
    app: mxl-avsync-demo
spec:
  terminationGracePeriodSeconds: 20
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: generator
      image: ghcr.io/leeo86/mxl-avsync:nightly-dev
      ports:
        - {name: http, containerPort: 8180}
      env:
        - {name: AVSYNC_ROLE, value: generator}
        - {name: AVSYNC_STATE_DIR, value: /config}
        - {name: NMOS_ENABLE, value: "false"}
        - {name: NMOS_DNS_SD, value: "false"}
        - {name: MXL_DOMAIN_SCAN_PATH, value: /mxl}
        - {name: MXL_OUTPUT_DOMAIN_DIR, value: /mxl/generator}
        - {name: MXL_CLEANUP_ON_EXIT, value: "true"}
        - {name: WEB_PORT, value: "8180"}
      readinessProbe:
        httpGet: {path: /readyz, port: http}
      livenessProbe:
        httpGet: {path: /livez, port: http}
      volumeMounts:
        - {name: mxl, mountPath: /mxl}
        - {name: generator-config, mountPath: /config}
    - name: analyzer
      image: ghcr.io/leeo86/mxl-avsync:nightly-dev
      ports:
        - {name: http, containerPort: 8181}
      env:
        - {name: AVSYNC_ROLE, value: analyzer}
        - {name: AVSYNC_STATE_DIR, value: /config}
        - {name: NMOS_ENABLE, value: "false"}
        - {name: NMOS_DNS_SD, value: "false"}
        - {name: MXL_DOMAIN_SCAN_PATH, value: /mxl}
        - {name: MXL_OUTPUT_DOMAIN_DIR, value: /mxl/analyzer}
        - {name: MXL_CLEANUP_ON_EXIT, value: "true"}
        - {name: WEB_PORT, value: "8181"}
      readinessProbe:
        httpGet: {path: /readyz, port: http}
      livenessProbe:
        httpGet: {path: /livez, port: http}
      volumeMounts:
        - {name: mxl, mountPath: /mxl}
        - {name: analyzer-config, mountPath: /config}
  volumes:
    - name: mxl
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: generator-config
      emptyDir: {}
    - name: analyzer-config
      emptyDir: {}
